# round3 web01 · Express SSRF —— 本地可复现部署
#
# 拓扑（忠实还原原题）：
#   app  容器：外网 express 0.0.0.0:3000  +  内网 express 127.0.0.1:3456(/secret)
#   dns  容器：挑战专用 DNS，*.baidu.com → 127.0.0.1（固定 IP 10.77.0.53）
#   app 容器把 DNS 指向 dns 容器（dns: 段）→ 容器内 x.baidu.com 解析到 127.0.0.1
#
# 起容器：
#   docker compose -f deploy/docker-compose.yml up -d --build
# 打靶：
#   python solve/solve.py --target http://127.0.0.1:3000
# 收工：
#   docker compose -f deploy/docker-compose.yml down -v
# 显式工程名，避免所有题目的 deploy 目录同名互踩容器
name: qwb-r3-web01
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qwb-r3-web01-app
    environment:
      PORT: "3000"
      FLAG_FILE: /flag
    ports:
      - "3000:3000"
    # 关键：把容器的解析器换成挑战专用 DNS
    dns:
      - 10.77.0.53
    networks:
      - ravel

  dns:
    build:
      context: .
      dockerfile: Dockerfile.dns
    container_name: qwb-r3-web01-dns
    networks:
      ravel:
        ipv4_address: 10.77.0.53

networks:
  ravel:
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.0.0/24
